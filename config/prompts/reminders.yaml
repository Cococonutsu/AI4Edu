# prompt_version: reminders-2026.10.21-1
# 回合内发给模型的短文字：临时提醒、工具结果中的指令、学生可见的错误提示。
# 由 prompts/reminders.py 读取。占位符格式 {name}（Python str.format），缺少占位符时报错。
# 改动后提升首行的 prompt_version。

# 回合守卫：这一步既没有正文也没有工具调用（例如只有思考就结束了）
guard_empty: "（系统提醒：你这一步没有对学生说任何话。请立刻回复学生：能直接回答的就直接写正文；需要记诊断或拆题的就调用对应工具。）"

# 本步已有正文下发给学生，下一步不许重写
already_sent: "（系统提醒：你在本回合已经对学生说过上面那段话，学生已经看到。不要重复或改写它；如果没有新的内容要补充，就不要再输出正文。）"

# analyze_problem 工具结果里给辅导老师的下一步指令
after_analyze_confident: "用一句话复述题目要求，然后围绕当前子任务提出第一个问题；直接写正文，不要调用工具。"
analyze_failed: "题目模型不合格：{error}。请修正后重新调用 analyze_problem；如果题目文字或图片确实看不清，请让学生补发更清晰的内容。"

# draw_figure 工具结果
figure_invalid: "图形描述不合格：{error}。请修正后重新调用 draw_figure。"
figure_shown: "图已打开，学生能看到并拖动。请只用一两句话说明该看什么、该拖哪个点或滑块，不要复述图中的数值，然后继续围绕当前子任务提问。"

# 联网工具（web_search / web_fetch）的工具结果
after_web_search: "搜索结果已经给你。只取教学需要的事实，用学生年级能听懂的话概括，不贴链接和原文，然后接回当前子任务。"
after_web_fetch: "网页内容已经给你。只取与当前教学相关的部分用学生能懂的话概括，不要照搬原文，然后接回当前子任务。"
web_search_failed: "联网搜索没有成功（{error}）。不要编造网上的信息：简单告诉学生这次没查到，再基于课本知识继续辅导。"
web_fetch_failed: "网页抓取没有成功（{error}）。可以换更具体的关键词重新 web_search，或基于已有信息继续辅导。"
web_tools_unavailable: "联网功能当前没有开通。简单告诉学生暂时查不了网，然后基于课本知识继续辅导。"

# 工具执行层回给模型的错误说明
unknown_tool: "未知工具 {name}，请只使用提供的工具。"
bad_tool_arguments: "{error}。请重新调用 {name} 并给出合法 JSON 参数。"
tool_execution_failed: "工具 {name} 执行失败，请换一种方式继续。"

# 学生可见的错误提示（前端直接显示）
student_guard_error: "老师刚才走神了，请再发一次你的回答。"
student_max_steps: "老师需要再想一想，请稍后再试。"
student_generic_error: "出了点问题，请稍后再试。"
student_empty_reply: "这次没能读懂题目，可以换一张更清晰的照片，或者把题目打字发给我。"
student_network_error: "老师这边网络不太好，请稍后再发一次。"
