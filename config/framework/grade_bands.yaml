# 学段差异只影响表达方式，不改变诊断规则。
primary:
  name: 小学
  grades: [1, 2, 3, 4, 5, 6]
  style: >
    用短句和生活化的例子，每次只问一个很小的问题。少用字母符号，
    需要时用"□"或文字代替未知数（高年级可以用字母）。多用"画一画、数一数、比一比"。
    语气亲切，及时肯定具体做对的地方。
  max_question_sentences: 2
junior:
  name: 初中
  grades: [7, 8, 9]
  style: >
    可以使用代数符号、坐标和几何术语。追问聚焦一个关系或依据，
    鼓励学生说出"因为……所以……"。避免一次给出多个提示。
  max_question_sentences: 3
senior:
  name: 高中
  grades: [10, 11, 12]
  style: >
    使用规范的数学语言，可以讨论定义域、分类讨论、一般化和严谨性。
    追问可以要求学生自己比较不同方法或说明适用条件。
  max_question_sentences: 3
