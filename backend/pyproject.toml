[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai4edu"
version = "0.1.0"
description = "面向小学至高中学生的数学 AI 辅导后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite",
    "pydantic>=2",
    "pydantic-settings",
    "openai",
    "httpx",
    "argon2-cffi",
    "pyyaml",
    "python-multipart",
]

[project.scripts]
ai4edu-admin = "ai4edu.cli.admin:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai4edu"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests/backend"]
pythonpath = ["src"]
